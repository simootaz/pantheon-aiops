# Observability overlay: Grafana, Tempo and the OTel collector.
#
# Phase: 7 - Production Hardening
#
# ADDITIVE, not alternative. Prometheus and Loki come from the dev overlay, so
# this file layers visualisation and tracing on top rather than defining a
# second copy of them - two overlays declaring the same service is how a merge
# nobody predicted happens.
#
# Compose it after dev:
#   -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.obs.yml
#
# Configuration files live in deploy/observability/.

name: pantheon

services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ../observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  tempo:
    image: grafana/tempo:latest
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ../observability/otel:/etc/otel:ro

volumes:
  grafana-data:
  tempo-data:
