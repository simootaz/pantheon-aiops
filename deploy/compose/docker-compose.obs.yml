# Observability overlay: Prometheus, Grafana, Loki, Tempo, OTel collector.
#
# Phase: 7 - Production Hardening
#
# Brought up alongside the base stack when you want Pantheon to observe itself.
# Configuration files live in deploy/observability/.

name: pantheon

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ../observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:latest
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki

  tempo:
    image: grafana/tempo:latest
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ../observability/otel:/etc/otel:ro

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
