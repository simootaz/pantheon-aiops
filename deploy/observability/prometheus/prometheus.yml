# Prometheus scrape configuration for the Compose observability overlay.
#
# Phase: 7 - Production Hardening
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: pantheon-api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: minio
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster
