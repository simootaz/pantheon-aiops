# Prometheus configuration for the SIMULATOR ONLY.
#
# Phase: 1 - Contracts & First Agent Path
#
# ⚠️ NEVER DEPLOY THIS. The scrape interval below is a hundred times faster than
# anything sane for a real cluster, and pointing it at production would generate
# roughly 900 samples per series per 15 minutes per target.
#
# WHY THE FAST SCRAPE
# -------------------
# The simulator pushes metrics through a pushgateway, and a pushgateway
# **discards timestamps by design**: it holds the last value pushed, and
# Prometheus stamps it at scrape time. A baseline curve therefore only exists in
# elapsed time - it cannot be backfilled.
#
# So a simulated day is compressed into minutes, and the scrape has to be fast
# enough to sample the compressed curve densely enough for seasonality to be
# visible and for variance to be measurable. At the default 15s a compressed day
# yields a handful of points, and an anomaly detector trained on that is
# worthless.
#
# This is a workaround for a transport limitation, not a design. ROADMAP tracks
# `remote_write` with explicit timestamps, which becomes necessary at Phase 6:
# Moira needs ~30 days of history to forecast the next 30, and no scrape
# interval can compress that.
#
# The production-shaped config is prometheus.yml, and
# tests/unit/test_observability_stack.py fails the build if this file is
# referenced from any deployment path.

global:
  # Fast on purpose. See above.
  scrape_interval: 1s
  evaluation_interval: 5s
  external_labels:
    environment: simulation

scrape_configs:
  - job_name: pushgateway
    # Essential: without it Prometheus overwrites the `job` and `instance`
    # labels the simulator pushed, and every pod collapses into one series.
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
