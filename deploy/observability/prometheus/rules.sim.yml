# Alerting rules for the SIMULATOR ONLY.
#
# Phase: 1 - Contracts & First Agent Path
#
# ⚠️ NEVER DEPLOY THIS. Every `for:` clause below is measured in seconds because
# the simulator compresses time; on a real cluster these are hair triggers that
# would page on a single slow minute. The production-shaped rules, when they
# exist, live beside prometheus.yml - and
# tests/unit/test_observability_stack.py fails the build if this file is
# referenced from any deployment path.
#
# WHY EVERY RULE IS A GAUGE OR A RATIO
# ------------------------------------
# The simulator advances simulated time faster than wall time, and Prometheus
# scrapes in wall time. A counter therefore reads `speed` times faster than the
# rate it represents: `rate(pantheon_http_requests_total[10s])` at 200x is 200x
# the simulated request rate. An absolute counter threshold would fire at one
# compression factor and be unreachable at another.
#
# Two things are immune, and every rule here is one of them:
#
#   * a **gauge** - a CPU reading or a memory reading is the same number
#     whatever the clock does;
#   * a **ratio of two rates** - the compression factor appears in numerator and
#     denominator and cancels exactly.
#
# So these rules mean the same thing at `--speed 1` and at `--speed 500`, and
# `tests/unit/test_alert_rules.py` fails the build on a rule that compares a
# bare `rate()` against a constant.
#
# WHY THE WINDOWS ARE SHORT
# -------------------------
# `for:` and range selectors are wall-clock. A fault lasting D simulated seconds
# is visible for only D/speed wall seconds, so:
#
#     range_window + for_duration  <  fault_simulated_duration / speed
#
# The tightest scenario is bad_deploy_5xx: 11400 simulated seconds of fault,
# which at the 200x reference speed is 57 wall seconds. A `for: 5m` clause
# would never fire; a 10s window plus a 10s hold uses 20 of those 47 seconds and
# leaves room for the scrape to catch up. That inequality is enforced by
# `test_every_rule_can_fire_within_its_scenarios_fault_window`, so a rule cannot
# silently become unfirable at one speed and a hair trigger at another.

# HOW EVERY THRESHOLD HERE IS DERIVED
# -----------------------------------
# Not chosen. Each one is measured against the generator and must satisfy two
# conditions, in this order of priority:
#
#   1. SUSTAIN. The signal must stay past the threshold for longer than the
#      `for:` clause, with margin measured in EVALUATION INTERVALS - not in
#      percent. The interval here is 5s, so a rule holding 10.5s against a
#      `for: 10s` has half a second of slack: one evaluation landing late and
#      it never fires. Treat anything under roughly one extra interval of
#      headroom as failing.
#
#   2. CLEAR THE BASELINE. The threshold must sit above the **highest observed
#      baseline value**, not the mean and not p99. A rule that fires on the
#      worst clean minute of the week is an alarm, not a detector, and the
#      tail is exactly where that happens.
#
# **Sustain is the binding constraint, and it is the counter-intuitive one.**
# The instinct when tuning is to maximise separation from baseline by raising
# the threshold, which is precisely how both rules that failed here were set:
# each sat above the fault's own MEDIAN, so it fired on peaks and never held
# its `for:`. noisy_neighbor's fault has median 0.355 against a 0.45 threshold;
# flaky_test_storm's has median 0.138 against 0.20.
#
# So compare against the fault's median, not its peak. A threshold under the
# median sustains; a threshold over it only touches. Where the two conditions
# compete, take the lower threshold and the longer sustain: separation you can
# spare is cheaper than a rule that cannot fire.
#
# Every value below states its measurement - baseline distribution, fault
# median and peak, and the wall seconds it holds. A threshold without those
# numbers beside it has not been derived, whatever it is set to.

groups:
  - name: pantheon-simulator
    # 5s, matching evaluation_interval in prometheus.sim.yml. A rule evaluated
    # more slowly than its `for:` window can miss a compressed fault entirely.
    interval: 5s
    rules:
      # --- bad_deploy_5xx -------------------------------------------------
      # A ratio of two rates, so the compression factor cancels. Baseline is
      # ~0.004 (error_rate 0.72/s against 180 rps); the scenario steps error
      # rate 9x, giving ~0.036. The 0.02 threshold sits between them, five
      # times baseline and well inside the fault.
      - alert: CheckoutErrorRateHigh
        expr: |
          sum by (service) (rate(pantheon_http_requests_total{status="500"}[10s]))
            /
          sum by (service) (rate(pantheon_http_requests_total[10s]))
            > 0.02
        for: 10s
        labels:
          severity: critical
          scenario: bad_deploy_5xx
        annotations:
          summary: "{{ $labels.service }} is serving 5xx above baseline"
          description: >-
            The 5xx ratio for {{ $labels.service }} is {{ $value | humanizePercentage }},
            more than five times its normal rate.

      # --- memory_leak ----------------------------------------------------
      # Compared against ITSELF A WHILE AGO, not against a trailing average.
      #
      # The distinction is the whole rule. The fault is a ramp, and a ramp
      # measured against its own trailing average barely moves - the average
      # follows it up, and the ratio sits near 1.2 no matter how far the leak
      # goes. Measured against Prometheus, the `avg_over_time` form only ever
      # crossed 1.5 momentarily, on the sawtooth of the OOM phase, and never
      # held long enough to fire. `offset` compares two points instead of a
      # point against a smear, so a sustained climb reads as a sustained climb.
      #
      # Memory is a gauge, so compression cannot touch the comparison. At
      # memory_leak's gate speed a 30s offset looks back about six simulated
      # hours, over which the scenario's 2.6x ramp has moved roughly 1.9x -
      # comfortably past the threshold and sustained rather than transient.
      - alert: MemoryGrowingAgainstItsOwnBaseline
        expr: |
          pantheon_pod_memory_working_set_bytes
            >
          1.5 * (pantheon_pod_memory_working_set_bytes offset 30s)
        for: 10s
        labels:
          severity: warning
          scenario: memory_leak
        annotations:
          summary: "{{ $labels.pod }} working set is climbing against its own past"
          description: >-
            {{ $labels.pod }} is holding {{ $value | humanize1024 }}B, half again
            what it held moments ago, while its request rate is unchanged.

      # --- noisy_neighbor -------------------------------------------------
      # An absolute latency threshold, SLO-style, and deliberately not a
      # self-relative one. The fault is a RAMP, and a ramp compared against its
      # own trailing average never shows much of a ratio - the average follows
      # it up. Measured against the generator: node-c's worst pod latency peaks
      # at 0.386s across seven simulated days of baseline and reaches 0.69s or
      # Re-measured against the corrected generator, 2026-08-20. Baseline over
      # 5761 samples: p50 0.214, p95 0.248, max 0.248 - a very tight
      # distribution. The fault reaches 0.721, median 0.355.
      #
      # 0.45 was above the fault's median, so it held for only 7.0s wall
      # against a `for: 10s` - it fired on peaks and never sustained. 0.32
      # holds 11.1s while sitting 1.29x above the highest baseline value in
      # those 5761 samples and 1.49x above the median.
      #
      # The binding constraint here is sustain, not separation: 0.34 also
      # clears the baseline but holds only 10.5s, and at a 5s evaluation
      # interval half a second of headroom is one evaluation away from
      # flaking.
      #
      # Grouped by NODE, not by service, because that is the scenario's whole
      # point: the symptom is on catalog and notifier while the cause is search
      # eating the node. An alert per service would send three pages and name
      # the wrong culprit in all of them.
      #
      # Latency is a gauge, so no range selector is needed and compression
      # cannot touch it.
      - alert: NodeLatencyElevated
        expr: |
          max by (node) (pantheon_http_request_duration_seconds) > 0.30
        for: 10s
        labels:
          severity: warning
          scenario: noisy_neighbor
        annotations:
          summary: "every workload on {{ $labels.node }} is slow"
          description: >-
            Worst-case latency on {{ $labels.node }} is {{ $value }}s. Look for a
            neighbour saturating the node before looking at the slow service.

      # --- disk_pressure --------------------------------------------------
      # A ratio of two gauges, so it is both compression-proof and independent
      # of node size. 0.75 fires with time to spare before the kubelet's own
      # eviction threshold.
      #
      # Re-measured 2026-08-24, against a node disk gauge that finally carries
      # the noise and seasonality it declares. `_node_disk` used to build its
      # value from scratch and never called `_baseline`, so this rule was
      # written against a deterministic straight line at 0.34.
      #
      # Baseline now spans 0.3355 - 0.3451 across 4.5 simulated days. The ramp
      # peaks at 0.8925 and first crosses 0.75 at simulated 336300s, staying
      # above it for 0.60 simulated days - 23.6% of the fault window, which is
      # what gives the 10s `for` room to hold.
      #
      # The margin that nearly disappeared: disk carries no weekly component
      # (`WEEKLY_AMPLITUDE[DISK_USED] = 0.0`). With the global 0.72 weekend
      # multiplier that every other metric uses, the peak would fall to 0.636
      # and this rule would never fire on a run landing on a simulated
      # weekend.
      - alert: NodeDiskFillingUp
        expr: |
          pantheon_node_disk_used_bytes / pantheon_node_disk_total_bytes > 0.75
        for: 10s
        labels:
          severity: warning
          scenario: disk_pressure
        annotations:
          summary: "{{ $labels.node }} disk is {{ $value | humanizePercentage }} full"
          description: >-
            Disk on {{ $labels.node }} is filling steadily. Eviction starts well
            before it reaches 100%.

      # --- flaky_test_storm -----------------------------------------------
      # CI telemetry, not a production symptom - which is the whole point of the
      # scenario: production metrics stay flat while CI goes red. The ratio is
      # published as a gauge for exactly this reason.
      #
      # Re-measured against the corrected generator, 2026-08-20. Baseline over
      # 2881 samples: p50 0.033, p95 0.037, max 0.037. The storm reaches 0.471,
      # median 0.138.
      #
      # 0.20 sat above the storm's median, so it held 8.6s against a
      # `for: 10s` and the rule could never fire. 0.12 holds 11.4s at 3.26x
      # the highest baseline value seen. Dropping further buys no sustain -
      # 0.10 and 0.08 also hold 11.4s - so 0.12 is the most specific threshold
      # that fires.
      - alert: CiFailureRatioHigh
        expr: |
          pantheon_ci_pipeline_failure_ratio > 0.09
        for: 10s
        labels:
          severity: warning
          scenario: flaky_test_storm
        annotations:
          summary: "{{ $labels.service }} CI is failing {{ $value | humanizePercentage }} of runs"
          description: >-
            Pipelines are failing far above the normal flake rate while
            production metrics are unchanged. Suspect the suite, not the service.
