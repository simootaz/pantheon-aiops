# Kustomize staging overlay.
#
# Phase: 6 - Go Port & Platform Binaries
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pantheon-staging

resources:
  - ../../base

images:
  - name: ghcr.io/simootaz/pantheon
    newTag: staging

replicas:
  - name: pantheon-api
    count: 2

