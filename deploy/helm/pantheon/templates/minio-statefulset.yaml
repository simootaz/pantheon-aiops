{{/*
Bundled MinIO. Everything in this file is gated on .Values.minio.enabled, so
setting it false and filling in minio.external swaps in any S3-compatible
provider without touching application code. See ADR 0001.
*/}}
{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pantheon.fullname" . }}-minio
  labels:
    {{- include "pantheon.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "pantheon.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "pantheon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "pantheon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      # The same hardened context every other workload in this chart uses. It
      # was missing here, and trivy's KSV-0014 and KSV-0118 caught it - MinIO
      # holds the artifacts and backups, so it is the last workload that should
      # have been running with a writable root and no dropped capabilities.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pantheon.minioSecretName" . }}
                  key: {{ .Values.minio.secretKeys.secretKey }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.minio.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.minio.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
  {{- end }}
{{- end }}
