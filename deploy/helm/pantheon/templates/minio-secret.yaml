{{/*
Generated MinIO credential, for evaluation only.

Created only when minio.existingSecret is empty. Production installs should
supply their own secret - see deploy/security/sealed-secrets/.

The lookup preserves an already-generated password across `helm upgrade`;
without it every upgrade would mint a new one and orphan the stored data.
*/}}
{{- if and .Values.minio.enabled (not .Values.minio.existingSecret) }}
{{- $name := printf "%s-minio" (include "pantheon.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data .Values.minio.secretKeys.secretKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pantheon.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
type: Opaque
stringData:
  {{ .Values.minio.secretKeys.accessKey }}: {{ .Values.minio.rootUser | quote }}
  {{ .Values.minio.secretKeys.secretKey }}: {{ $password | quote }}
{{- end }}
