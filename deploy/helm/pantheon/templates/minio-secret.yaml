{{/*
Generated MinIO credential - DEVELOPMENT AND DEMO ONLY.

Created only when minio.existingSecret is empty. Production installs must supply
their own secret; `productionMode: true` makes the chart refuse to render without
one (see validation.yaml).

WHY THIS IS NOT SAFE FOR PRODUCTION
-----------------------------------
`lookup` returns empty on any CLIENT-SIDE render - `helm template`, `helm
diff`, and Argo CD's default rendering mode. In those contexts the branch below
falls through to randAlphaNum, so every render produces a DIFFERENT password.
Under a GitOps controller that means: sync -> new password -> drift detected ->
secret rewritten, on a schedule. MinIO then holds data encrypted against a
credential the platform no longer knows.

`helm.sh/resource-policy: keep` stops Helm deleting the secret, which protects
the uninstall path. It does NOT stop a controller overwriting it on sync - only
supplying your own secret does that.
*/}}
{{- if and .Values.minio.enabled (not .Values.minio.existingSecret) }}
{{- $name := printf "%s-minio" (include "pantheon.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data .Values.minio.secretKeys.secretKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pantheon.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
  annotations:
    # Survive `helm uninstall` so a reinstall does not orphan the stored data.
    helm.sh/resource-policy: keep
    # Argo CD renders client-side by default, where lookup is empty. Without
    # this, each sync would regenerate the password and rewrite the secret.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
    pantheon.io/credential-policy: generated-dev-only
type: Opaque
stringData:
  {{ .Values.minio.secretKeys.accessKey }}: {{ .Values.minio.rootUser | quote }}
  {{ .Values.minio.secretKeys.secretKey }}: {{ $password | quote }}
{{- end }}
