# pnpm settings. Since pnpm 10 these live here rather than under a `pnpm` key
# in package.json - that key is silently IGNORED, which is how a fix can look
# applied and change nothing. pnpm warns about it; the warning is easy to scroll
# past, and this comment exists so the next person does not have to learn it
# twice.
#
# Phase: 1 - Contracts & First Agent Path

# Both are transitive through next and both carry HIGH advisories that
# `trivy fs` fails CI on. Overridden rather than waiting for next to ship them,
# so the change is narrow and reversible:
#
#   sharp    GHSA-f88m-g3jw-g9cj  fixed in 0.35.0
#   sharp    GHSA-rgj7-g3m4-5g8c  fixed in 0.35.4  (libheif; published after
#                                                   0.35.3 had passed CI)
#   postcss  CVE-2026-73646       fixed in 8.5.18
#
# A `>=` floor admits every later vulnerable release too - 0.35.3 satisfied
# `>=0.35.0` and is exactly what the second advisory is against. The floor moves
# with each advisory; it is not a promise about what comes after it.
overrides:
  sharp: '>=0.35.4'
  postcss: '>=8.5.18'
# pnpm policy for the dashboard.
#
# Phase: 4 - Delivery Flow

# Native postinstall scripts are opt-in. Each entry is a deliberate decision,
# because a build script runs arbitrary code at install time - in CI too.
allowBuilds:
  # Next's image optimiser. Not needed: Pantheon renders A2UI images through a
  # plain <img> pointing at a server-resolved signed URL, never through
  # next/image, because the URL comes from an ArtifactRef the server resolves
  # (docs/adr/0006-agentic-ui-protocols.md). Flip to true if next/image is ever
  # adopted.
  sharp: false

# pnpm 11 withholds packages younger than its minimum release age. The AG-UI
# SDK publishes frequently and its current release is newer than that window, so
# these are excluded explicitly rather than by lowering the policy for
# everything.
minimumReleaseAgeExclude:
  - '@ag-ui/client@0.0.58'
  - '@ag-ui/core@0.0.58'
  - '@ag-ui/encoder@0.0.58'
  - '@ag-ui/proto@0.0.58'
