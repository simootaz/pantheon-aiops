# Clio - agent manifest.
#
# Loaded and validated by core.registry.loader against
# core.contracts.manifest.AgentManifest. A manifest that does not validate is a
# broken agent, and tests/unit/test_contracts.py fails the build rather than
# letting it surface at dispatch time.
#
# Phase: 5 - Proactive Flow

codename: clio
domain: reporting
description: >-
  Writes incident timelines, postmortems and executive summaries.

# `write_timeline` was declared here and is not an agent capability: a timeline
# is a pure ordering of the Investigation's own timestamps, and it lives in
# core/reporting/timeline.py, served by GET /investigations/{id}/timeline. An
# agent producing it would put "what happened so far" in the Findings list,
# which is a list of claims about the incident.
capabilities:
  - name: write_postmortem
    description: Draft a postmortem from an investigation.
  - name: summarise_for_executives
    description: Compress a verdict to its decisions and cost.
tools:
  []
budget:
  max_tokens: 32768
  max_seconds: 180
  max_tool_calls: 5
