# Moira - agent manifest.
#
# Loaded and validated by core.registry.loader against
# core.contracts.manifest.AgentManifest. A manifest that does not validate is a
# broken agent, and tests/unit/test_contracts.py fails the build rather than
# letting it surface at dispatch time.
#
# Phase: 5 - Proactive Flow

codename: moira
domain: capacity
description: >-
  Forecasts resource capacity and predicts saturation before it happens.

capabilities:
  - name: forecast_saturation
    description: Project when a resource crosses its limit.
  - name: recommend_headroom
    description: Propose a request or limit that holds the forecast.
# One tool. `kubernetes.list` and `kubernetes.top` were declared here and exist
# in no language - the Go connector's read-only tools are scaffolding - and a
# dispatchable agent naming a tool nothing implements is refused by
# test_every_implemented_agent_can_reach_the_tools_it_declares. They return when
# they exist, and with them a memory limit to project against.
tools:
  - prometheus.query_range
budget:
  max_tokens: 16384
  max_seconds: 300
  max_tool_calls: 25
