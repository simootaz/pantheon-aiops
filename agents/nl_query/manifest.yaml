# Hermes - agent manifest.
#
# Loaded and validated by core.registry.loader against
# core.contracts.manifest.AgentManifest. A manifest that does not validate is a
# broken agent, and tests/unit/test_contracts.py fails the build rather than
# letting it surface at dispatch time.
#
# Phase: 2 - Orchestrator & Investigation Flow

codename: hermes
domain: nl_query
description: >-
  Translates natural language questions into connector queries and answers back.

capabilities:
  - name: translate_question
    description: Turn a question into one or more connector queries.
  - name: summarise_result
    description: Render a query result as an answer with its caveats.
# Only tools something actually implements.
#
# `kubernetes.list` and `kubernetes.get` were declared here and exist in no
# language: the Go connector's `readonly.Tools()` is scaffolding and its
# python_ref is a six-line stub. A declaration nothing implements makes
# ToolNotBound the NORMAL case rather than the exceptional one, which trains
# everyone to ignore it - the same argument that keeps an unimplemented tool out
# of a connector. They come back when the connector serves them.
tools:
  - prometheus.query_instant
  - loki.query_range
budget:
  max_tokens: 16384
  max_seconds: 90
  max_tool_calls: 15
