# Mnemosyne - agent manifest.
#
# Loaded and validated by core.registry.loader against
# core.contracts.manifest.AgentManifest. A manifest that does not validate is a
# broken agent, and tests/unit/test_contracts.py fails the build rather than
# letting it surface at dispatch time.
#
# Phase: 5 - Proactive Flow

codename: mnemosyne
domain: knowledge
description: >-
  Recalls prior investigations of the same alert on the same subject, and what
  they concluded.

capabilities:
  - name: recall_similar_incident
    description: >-
      Find past investigations of this alert on this subject. Exact on the
      trigger's own labels - the same alertname and the same pod, service, node,
      instance or namespace - not similar by any measure that would need tuning.
# `find_runbook` was declared here and is not: nothing stores a runbook, and a
# capability nothing can perform reads as one that works.
# The one tool is provided by the runtime - core/memory/recall.py - because it
# closes over the investigation store. `prometheus.query_instant` was declared
# and never called; a declared tool nothing calls is an allowlist entry for
# nothing.
tools:
  - memory.recall
budget:
  max_tokens: 4096
  max_seconds: 30
  max_tool_calls: 2
