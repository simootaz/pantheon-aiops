# Pre-commit hooks for Pantheon.
#
# Phase: 0 - Scaffold & Tooling
#
# Install with `pre-commit install`. Note that the codegen drift hook below
# fails until feature/codegen-pipeline implements codegen/verify.sh - that is
# why `make install` does not install the git hooks for you yet.

default_install_hook_types: [pre-commit]

repos:
  # First, because everything below it is meaningless on a file that still has
  # conflict markers in it - and because one got committed. `git merge` left
  # README.md and ARCHITECTURE.md unresolved, the merge was committed anyway,
  # and the markers reached the branch. Nothing objected: ruff and mypy do not
  # read Markdown, and no hook looked.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs from the project environment, not from a pre-commit-managed venv.
  #
  # mirrors-mypy installs its own isolated venv, which means every runtime
  # dependency has to be duplicated into additional_dependencies. That list
  # drifts silently: adding fastapi to the project made the hook fail with
  # "Cannot find implementation or library stub" while `make typecheck` stayed
  # green - a divergence that only shows up at commit time. Running `uv run
  # mypy` uses the same environment and the same pyproject config as the
  # Makefile, so the two can never disagree.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project env)
        entry: uv run mypy
        language: system
        types: [python]
        # mypy is configured entirely in pyproject.toml, including which trees
        # it walks, so it must not be handed the staged file list.
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: codegen-verify
        name: codegen drift check
        description: Fail if generated output has drifted from core/contracts/.
        entry: bash codegen/verify.sh
        language: system
        pass_filenames: false
        # TODO: Phase 0 - becomes green on branch feature/codegen-pipeline.
