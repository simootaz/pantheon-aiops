# Go checks across the workspace.
#
# Phase: 7 - Production Hardening
#
# NOTE: `go build ./...` is deliberately absent. The repo root is not a Go
# module, so that pattern is invalid here - and adding a root go.mod would not
# help, because nested modules are pruned from a parent's package walk, so it
# would report success while building nothing. The module-path pattern below
# covers all five modules and all packages. See docs/REPOSITORY_MAP.md.
name: ci-go

on:
  workflow_call:

permissions: {}

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

env:
  # 1.25, not the 1.23 in go.work. go.work states the LANGUAGE version
  # the modules are written against; this is the TOOLCHAIN installed on the
  # runner, and the pinned generators need it: go-jsonschema v0.24.1 and
  # golangci-lint v2.12.2 both require go >= 1.25.0.
  #
  # GOTOOLCHAIN=local is deliberate and stays. A developer machine running
  # 1.23 silently downloads 1.25 to satisfy those tools and prints one line
  # saying so; CI must not, or the version actually used stops being the
  # version anyone pinned. That auto-switch is why fifteen runs failed while
  # every local run passed.
  GO_VERSION: "1.25"
  # Declared rather than inherited. `actions/setup-go` happens to default to
  # local, but a guard that asserts an action's default is asserting someone
  # else's implementation detail - and the comment above claimed this was set
  # while nothing set it.
  GOTOOLCHAIN: local
  MODULE_PATTERN: github.com/simootaz/pantheon-aiops/...

jobs:
  go:
    name: fmt, vet, lint, build, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum exists (no external dependencies yet), so setup-go's
          # dependency-hash cache has nothing to key on. Cached explicitly below.
          cache: false

      - name: Cache Go build and module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('**/go.mod', 'go.work') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: gofmt -l
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt found unformatted files:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
          echo "gofmt: clean"

      - name: go work sync
        run: go work sync

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: make lint-go
        run: make lint-go

      - name: make test-go
        run: make test-go

      # The single root-level command that genuinely covers every module.
      # Referenced as a shell variable, not a `${{ }}` expansion inside `run`.
      - name: Build every module
        run: go build "${MODULE_PATTERN}"
