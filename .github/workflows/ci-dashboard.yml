# Dashboard checks: biome, tsc, vitest and the production build.
#
# Phase: 7 - Production Hardening
#
# The presence check this workflow used to carry is gone: the dashboard exists,
# so a job that might silently skip is now a liability rather than a courtesy.
name: ci-dashboard

on:
  workflow_call:

permissions: {}

concurrency:
  group: ci-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: biome, tsc, vitest, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version pinned here on purpose: action-setup reads `packageManager`
      # from dashboard/package.json, so CI uses exactly the pnpm a developer
      # uses locally. Pinning it twice is how the two drift.
      #
      # `package_json_file` is load-bearing. The action defaults to the
      # repository ROOT package.json, and this repo has none - the dashboard is
      # the only Node project. Without it the action fails with "No pnpm version
      # is specified", which is what every run did while the comment above
      # claimed the file was being read.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: dashboard/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: biome
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Generated types are committed. A change here means someone hand-edited
      # them or skipped `make codegen`.
      - name: Generated types must not be hand-edited
        run: |
          if [ -n "$(git status --porcelain types/generated)" ]; then
            echo "::error::dashboard/types/generated changed during the build" >&2
            git --no-pager diff -- types/generated
            exit 1
          fi
