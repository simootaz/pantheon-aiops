# Security scanning: Trivy, gitleaks, bandit and an SBOM.
#
# Phase: 7 - Production Hardening
#
# Findings go to GitHub code scanning as SARIF. Each upload sets a distinct
# `category`: without one, the second upload of a run replaces the first, and
# the alerts from every scanner but the last vanish silently.
#
# The SBOM stays an artifact. It is an inventory, not a set of findings, and
# SARIF has nowhere sensible to put it.
name: security

on:
  workflow_call:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    name: trivy fs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF findings to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two runs, deliberately. `severity` does NOT filter SARIF output: that
      # format carries every severity, because code scanning does its own
      # filtering. Combined with exit-code 1 in a single step, the job then
      # fails on ANY finding while reporting "CRITICAL or HIGH" - a threshold
      # that reads as enforced and is not the one enforced. So the report is
      # one step and the gate is another, each doing only its own job.
      - name: Report every finding to code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: "0" # a report, not a gate
          format: sarif
          output: trivy-fs.sarif

      # Uploaded even when the scan failed - the findings are the reason it
      # failed, so dropping them here would hide exactly what needs looking at.
      - name: Upload to code scanning
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # `table` on purpose: the SARIF goes to a UI, and a failing job needs its
      # reason in the log. Diagnosing the previous failure meant pulling alerts
      # from the API because the console said only that something was found.
      - name: Fail on CRITICAL or HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  trivy-config:
    name: trivy config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF findings to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dockerfiles, Compose, Helm templates, Terraform and Kubernetes manifests.
      - name: Report every finding to code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "0" # a report, not a gate - see the note in trivy-fs
          format: sarif
          output: trivy-config.sarif

      - name: Upload to code scanning
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Fail on CRITICAL or HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF findings to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secret scanning needs history, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        id: scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # We upload to code scanning below rather than attaching an artifact.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      # The action writes results.sarif by convention rather than by documented
      # contract, so this reports what it found instead of assuming. A missing
      # file is surfaced as a notice, not swallowed - an upload step that
      # quietly does nothing is the failure mode this whole repo is built to
      # avoid.
      - name: Locate the SARIF report
        if: always()
        id: sarif
        run: |
          if [ -f results.sarif ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "results.sarif found"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::gitleaks produced no results.sarif; findings are in the step log only"
            ls -1 ./*.sarif 2>/dev/null || true
          fi

      - name: Upload to code scanning
        if: always() && steps.sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Fail on findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::gitleaks found committed secrets" >&2
          exit 1

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF findings to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Run as a tool rather than a project dependency: bandit is CI-only and
      # does not belong in everyone's dev environment. SARIF comes from
      # bandit-sarif-formatter, since bandit itself emits only
      # csv/html/json/screen/txt/xml/yaml.
      - name: Scan first-party Python
        id: scan
        continue-on-error: true
        run: |
          uvx --with bandit_sarif_formatter bandit \
            --severity-level medium --confidence-level medium \
            -r core agents api connectors simulator codegen \
            -f sarif -o bandit.sarif

      - name: Upload to code scanning
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Fail on findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::bandit found medium-or-higher issues; see the code scanning alerts" >&2
          exit 1

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: pantheon-sbom.spdx.json
          output-file: pantheon-sbom.spdx.json

      # An inventory, not findings - so it stays an artifact rather than SARIF.
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: pantheon-sbom.spdx.json
          if-no-files-found: error
