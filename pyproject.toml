# Pantheon Python project definition.
#
# Phase: 0 - Scaffold & Tooling
#
# Python 3.12 is the target and the floor. The upper bound is deliberate: the
# platform is validated against exactly one minor version, and .python-version
# pins it for uv.

[project]
name = "pantheon-aiops"
version = "0.2.0"
description = "Polyglot multi-agent AIOps platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]

# Runtime dependencies are added by the branch that first needs them, so the
# scaffold stays honest about what it actually imports.
dependencies = [
    "pydantic>=2.9",
    # simulator: CLI, deterministic noise, and metric push
    "typer>=0.15",
    "numpy>=2.1",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # AG-UI event types and encoder. Depended on, never redefined - see
    # docs/adr/0006-agentic-ui-protocols.md.
    "ag-ui-protocol>=0.1.20,<0.2",
    "pydantic-settings>=2.7,<3",
    "mcp>=1.2,<2",
    # zeus: the Investigation store. One table, one JSONB document - see
    # core/store/investigations.py for why this arrived without a migration tool.
    "asyncpg>=0.30,<1",
]

[project.scripts]
pantheon-sim = "simulator.cli:main"

[project.urls]
Homepage = "https://github.com/simootaz/pantheon-aiops"
Repository = "https://github.com/simootaz/pantheon-aiops"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    # Required by fastapi.testclient.
    "httpx>=0.28",
    # Used by the structural guards to read Helm values.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "pytest-asyncio>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "api", "connectors", "simulator", "codegen"]

# ---------------------------------------------------------------------------
# ruff - lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = [
    "core/contracts/export",
    "connectors/kubernetes/pkg/contracts",
    "dashboard",
    "deploy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["core", "agents", "api", "connectors", "simulator", "codegen"]

# ---------------------------------------------------------------------------
# mypy - strict, no exceptions
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "agents", "api", "connectors", "simulator", "codegen", "tests"]
exclude = "^(dashboard|deploy)/"
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "agents"]
# --strict-markers is on, so every marker has to be declared here.
asyncio_mode = "auto"
markers = [
    "integration: needs a live observability stack; run it with `make test-sim`",
]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=core",
    "--cov=agents",
    "--cov=api",
    "--cov=connectors",
    "--cov=simulator",
    "--cov=codegen",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=json:coverage.json",
    # Set from what the code measures, not from an aspiration. The aggregate is
    # flattered - 61% of statements are Pydantic field declarations, covered by
    # import alone - so this is a backstop and tests/coverage_floor.py enforces
    # a per-module floor over the modules that actually branch. See ROADMAP.
    "--cov-fail-under=95",
]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/python_ref/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A __main__ guard cannot execute under pytest by construction, so counting
    # it as uncovered measures the test runner rather than the code. What the
    # guard calls is tested directly - see the stdio entrypoint test in
    # tests/unit/test_connectors.py, which asserts the wiring rather than
    # excusing it.
    'if __name__ == "__main__":',
]
